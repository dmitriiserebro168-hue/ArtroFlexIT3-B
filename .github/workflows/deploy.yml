# Выкладка ВАРИАНТА B (репозиторий ArtroFlexIT3-B) на it3b.artro-flex.com по FTPS при каждом push в main
# (и вручную: Actions → Deploy → Run workflow). Загружаются только изменённые файлы.
#
# ВАЖНО: без пароля выкладка не запускается, а FTP-аккаунт варианта A запрещён —
# чтобы B случайно не перезаписал вариант A на it3.artro-flex.com.
#
# Секреты репозитория ArtroFlexIT3-B (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER    — ftp.artro-flex.com (необязательно, это значение по умолчанию)
#   FTP_USERNAME  — it3b.artroflex@artro-flex.com (необязательно, это значение по умолчанию)
#   FTP_PASSWORD  — пароль FTP-аккаунта it3b (ОБЯЗАТЕЛЬНО)
# Переменная (вкладка Variables, необязательно):
#   FTP_SERVER_DIR — папка сайта B относительно корня FTP-аккаунта (по умолчанию ./).
#
# Токен Webvork и пароли — НЕ в GitHub, а в artroflex3b-config.php уровнем выше папки сайта
# (api/config.php ищет его в dirname(api, 2)). Образец — config.example.php.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-it3-b
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка синтаксиса PHP
        run: for f in api/*.php admin/*.php; do php -l "$f"; done

      - name: Проверка секретов FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || 'ftp.artro-flex.com' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || 'it3b.artroflex@artro-flex.com' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_SERVER" ]   || missing="$missing FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Не заданы секреты:$missing — выкладка B остановлена"; exit 1; fi
          case "$FTP_USERNAME" in
            it3.artroflex@it3.artro-flex.com) echo "::error::Это FTP-аккаунт варианта A — B туда не выкладываем"; exit 1;;
          esac

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftp.artro-flex.com' }}
          username: ${{ secrets.FTP_USERNAME || 'it3b.artroflex@artro-flex.com' }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Не выкладываем внутренние файлы и не трогаем данные, которые живут на сервере
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            docs/**
            README.md
            config.example.php
            artroflex3-config.php
            artroflex3b-config.php
            api/secrets.php
            _data/reviews.json
            _data/logs/**
            _data/rate/**
            _data/requests/**
            _data/phones/**
            assets/img/reviews/*.jpg
            assets/img/reviews/*.png
            assets/img/reviews/*.webp
            assets/img/experts/*.jpg
            assets/img/experts/*.png
            assets/img/experts/*.webp
            _data/experts.json
